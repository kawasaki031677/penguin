name: Build Debian package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            debhelper-compat

      - name: Get package version
        id: package
        run: |
          version=$(dpkg-parsechangelog -S Version)

          if [ -z "$version" ]; then
            echo "Could not determine package version."
            exit 1
          fi

          echo "Package version: $version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: dpkg-buildpackage -us -uc

      - name: Check package
        run: |
          deb=$(find .. -maxdepth 1 -type f -name '*.deb' | head -n 1)

          test -n "$deb"

          echo "Built package: $deb"

          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - name: Prepare packages
        id: prepare
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          deb=$(find .. -maxdepth 1 -type f -name '*.deb' | head -n 1)

          test -n "$deb"

          versioned_file="penguin_${VERSION}_amd64.deb"
          latest_file="penguin_latest_amd64.deb"

          cp "$deb" "$versioned_file"
          cp "$deb" "$latest_file"

          echo "Versioned package: $versioned_file"
          echo "Latest package: $latest_file"

          echo "versioned_file=$versioned_file" >> "$GITHUB_OUTPUT"
          echo "latest_file=$latest_file" >> "$GITHUB_OUTPUT"

      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSIONED_FILE: ${{ steps.prepare.outputs.versioned_file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."

            gh release upload "$TAG" \
              "$VERSIONED_FILE" \
              --clobber
          else
            gh release create "$TAG" \
              "$VERSIONED_FILE" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Update latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_FILE: ${{ steps.prepare.outputs.latest_file }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "Updating latest release."

            gh release upload latest \
              "$LATEST_FILE" \
              --clobber
          else
            echo "Creating latest release."

            gh release create latest \
              "$LATEST_FILE" \
              --title "Latest" \
              --notes "Latest build from main."
          fi