name: Build Debian package

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'debian/**'
      - '.github/workflows/build-deb.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            debhelper-compat

      - name: Get package version
        id: package
        run: |
          version=$(dpkg-parsechangelog -S Version)

          if [ -z "$version" ]; then
            echo "Could not determine package version."
            exit 1
          fi

          echo "Package version: $version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: dpkg-buildpackage -us -uc

      - name: Check package
        run: |
          deb=$(find .. -maxdepth 1 -type f -name '*.deb' | head -n 1)

          test -n "$deb"

          echo "Built package: $deb"

          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - name: Prepare packages
        id: prepare
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          deb=$(find .. -maxdepth 1 -type f -name '*.deb' | head -n 1)

          test -n "$deb"

          versioned_file="penguin_${VERSION}_amd64.deb"
          latest_file="penguin_latest_amd64.deb"

          cp "$deb" "$versioned_file"
          cp "$deb" "$latest_file"

          echo "Versioned package: $versioned_file"
          echo "Latest package: $latest_file"

          echo "versioned_file=$versioned_file" >> "$GITHUB_OUTPUT"
          echo "latest_file=$latest_file" >> "$GITHUB_OUTPUT"

      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSIONED_FILE: ${{ steps.prepare.outputs.versioned_file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."

            gh release upload "$TAG" \
              "$VERSIONED_FILE" \
              --clobber
          else
            gh release create "$TAG" \
              "$VERSIONED_FILE" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Find previous latest release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.package.outputs.tag }}
        run: |
          previous_tag=$(gh release list \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 20 \
            --json tagName,isLatest \
            --jq '.[] | select(.isLatest == false) | .tagName' \
            | grep '^v' \
            | grep -v "^${CURRENT_TAG}$" \
            | head -n 1 || true)

          echo "Previous release: $previous_tag"

          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Remove latest package from previous release
        if: steps.previous.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          echo "Removing penguin_latest_amd64.deb from $PREVIOUS_TAG"

          gh release delete-asset \
            "$PREVIOUS_TAG" \
            penguin_latest_amd64.deb \
            --yes || true

      - name: Add latest package to current release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          LATEST_FILE: ${{ steps.prepare.outputs.latest_file }}
        run: |
          gh release upload "$TAG" \
            "$LATEST_FILE" \
            --clobber